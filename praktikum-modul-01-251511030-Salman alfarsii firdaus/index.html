<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil Mahasiswa</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="header">
      <h1>Profil Mahasiswa</h1>
      <nav class="nav">
        <a href="#tentang">Tentang</a>
        <a href="#keterampilan">Keterampilan</a>
        <a href="#kontak">Kontak</a>
      </nav>
    </header>

    <main class="container">
      <!-- Tiga section dibungkus dalam .card-list dan diberi class .card -->
      <div class="card-list">
        <section id="tentang" class="card">
          <h2>Tentang Saya</h2>
          <img src="assets/profile.jpg" alt="Foto profil Salman" class="profile-img">
          <p>Saya mahasiswa D3 Teknik Informatika yang sedang belajar web.</p>
        </section>

        <section id="keterampilan" class="card">
          <h2>Keterampilan</h2>
          <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>Problem Solving</li>
          </ul>
        </section>

        <section id="kontak" class="card">
          <h2>Kontak</h2>
          <p>Hubungi saya </p>
          <a class="button" href="mailto:mahasiswa@example.com">Kirim email</a>
        </section>
      </div>
    </main>

    <footer class="footer">2026 - Profil Mahasiswa</footer>
  </body>
</html>
